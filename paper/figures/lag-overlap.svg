<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="From day 4 on, mean top-10 Jaccard is 0.81 for looks 12 hours apart, 0.75 a day apart, 0.72 three days apart and 0.66 ten days apart: 8.9, 8.6, 8.4 and 7.9 of 10 comments in common">
<style>
  text { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
